# Telegram upload config for `pack -s` (personal account via MTProto)
# Put this file in the root of the repository that you pack.
#
# On first run, Telegram will ask for login code (and password if 2FA is enabled).

telegram_api_id=1234567
telegram_api_hash=REPLACE_WITH_YOUR_API_HASH
telegram_to=@target_username_or_phone_or_user_id
telegram_session=~/.sync_tool_telegram
telegram_caption=sync pack from laptop
